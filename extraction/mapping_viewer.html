<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenMath — Theorem Mapping</title>
<script>
MathJax = {
  tex: {
    inlineMath: [['$','$'], ['\\(','\\)']],
    displayMath: [['\\[','\\]']],
    tags: 'ams',
    packages: {'[+]': ['ams']},
  },
  options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] },
  startup: { typeset: false },
};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f5f5f5;
    color: #1a1a1a;
    min-height: 100vh;
  }

  header {
    background: #1e293b;
    color: #f8fafc;
    padding: 1.25rem 2rem;
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 2rem;
    flex-wrap: wrap;
  }

  header h1 { font-size: 1.1rem; font-weight: 600; white-space: nowrap; }
  header h1 span { color: #94a3b8; font-weight: 400; margin-left: .5rem; font-size: .9rem; }

  #search {
    flex: 1;
    min-width: 200px;
    padding: .45rem .75rem;
    border: 1px solid #334155;
    border-radius: 6px;
    background: #0f172a;
    color: #f8fafc;
    font-size: .9rem;
    outline: none;
  }
  #search:focus { border-color: #6366f1; }

  .filters {
    display: flex;
    gap: .4rem;
    flex-wrap: wrap;
  }

  .filter-btn {
    padding: .3rem .65rem;
    border-radius: 999px;
    border: 1px solid #475569;
    background: transparent;
    color: #cbd5e1;
    font-size: .78rem;
    cursor: pointer;
    transition: background .15s, color .15s;
  }
  .filter-btn:hover { background: #334155; }
  .filter-btn.active { background: #6366f1; border-color: #6366f1; color: #fff; }

  main {
    max-width: 960px;
    margin: 0 auto;
    padding: 1.5rem 1rem;
  }

  #stats {
    font-size: .82rem;
    color: #64748b;
    margin-bottom: 1rem;
  }

  .card {
    background: #fff;
    border-radius: 10px;
    border: 1px solid #e2e8f0;
    margin-bottom: .9rem;
    overflow: hidden;
  }

  .card-header {
    padding: .8rem 1.1rem;
    display: flex;
    align-items: baseline;
    gap: .6rem;
    flex-wrap: wrap;
    cursor: pointer;
    user-select: none;
  }
  .card-header:hover { background: #f8fafc; }

  .badge {
    font-size: .7rem;
    font-weight: 600;
    padding: .15rem .5rem;
    border-radius: 999px;
    white-space: nowrap;
  }
  .badge-id      { background: #ede9fe; color: #5b21b6; }
  .badge-def     { background: #dbeafe; color: #1d4ed8; }
  .badge-thm     { background: #dcfce7; color: #15803d; }
  .badge-lem     { background: #fef9c3; color: #854d0e; }
  .badge-cor     { background: #ffe4e6; color: #be123c; }
  .badge-partial { background: #ffedd5; color: #c2410c; font-style: italic; }

  .card-title {
    font-weight: 600;
    font-size: .95rem;
    flex: 1;
  }

  .chevron {
    margin-left: auto;
    color: #94a3b8;
    font-size: .75rem;
    transition: transform .2s;
  }
  .card.open .chevron { transform: rotate(180deg); }

  .card-body { display: none; padding: 0 1.1rem 1rem; border-top: 1px solid #f1f5f9; }
  .card.open .card-body { display: block; }

  .section-label {
    font-size: .72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: #94a3b8;
    margin: .9rem 0 .3rem;
  }

  .latex-statement {
    font-size: .9rem;
    line-height: 1.8;
    color: #374151;
  }
  .latex-statement em { font-style: italic; }
  /* give display math some breathing room */
  .latex-statement mjx-container[display] { margin: .6em 0; }

  .lean-block {
    background: #0f172a;
    color: #e2e8f0;
    font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
    font-size: .8rem;
    line-height: 1.6;
    padding: .75rem 1rem;
    border-radius: 6px;
    overflow-x: auto;
    white-space: pre;
  }

  .symbol-line {
    font-size: .75rem;
    color: #64748b;
    font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace;
    margin-top: .5rem;
    word-break: break-all;
  }

  .no-results {
    text-align: center;
    color: #94a3b8;
    padding: 3rem 0;
    font-size: .9rem;
  }
</style>
</head>
<body>

<header>
  <h1>OpenMath <span>Theorem Mapping</span></h1>
  <input id="search" type="search" placeholder="Search by name, ID, or statement…">
  <div class="filters" id="filters"></div>
</header>

<main>
  <div id="stats"></div>
  <div id="cards"></div>
</main>

<script>
const KIND_BADGE = {
  definition: 'badge-def',
  theorem:    'badge-thm',
  lemma:      'badge-lem',
  corollary:  'badge-cor',
};

function kindBadge(kind) {
  return KIND_BADGE[kind] || 'badge-def';
}

function clean(s) {
  return String(s ?? '').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
}

function esc(s) {
  return clean(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Strip the outer \begin{theorem}...\end{theorem} (or definition/lemma/corollary) wrapper
// and convert basic LaTeX text commands to HTML so MathJax only has to handle math.
function latexToHtml(raw) {
  let s = clean(raw);

  // Remove outer document-level environment wrapper
  s = s.replace(/^\\begin\{(?:theorem|definition|lemma|corollary|proposition|remark)[^}]*\}\s*/i, '');
  s = s.replace(/\s*\\end\{(?:theorem|definition|lemma|corollary|proposition|remark)\}\s*$/i, '');

  // Cross-references → plain label, e.g. \eqref{eq:140a} → (140a)
  s = s.replace(/\\eqref\{eq:([^}]+)\}/g, '($1)');
  s = s.replace(/\\ref\{[^}]+\}/g, '(?)');

  // Text-mode commands → HTML
  s = s.replace(/\\emph\{([^}]*)\}/g, '<em>$1</em>');
  s = s.replace(/\\textbf\{([^}]*)\}/g, '<strong>$1</strong>');
  s = s.replace(/\\textit\{([^}]*)\}/g, '<em>$1</em>');
  s = s.replace(/\\text\{([^}]*)\}/g, '$1');

  // Paragraph breaks
  s = s.replace(/\n{2,}/g, '</p><p>');
  s = '<p>' + s + '</p>';

  return s;
}

let allEntries = [];
let activeKind = 'all';
let query = '';

function render() {
  const q = query.toLowerCase();
  const filtered = allEntries.filter(([id, e]) => {
    if (activeKind !== 'all' && e.kind !== activeKind) return false;
    if (!q) return true;
    return (
      id.toLowerCase().includes(q) ||
      (e.name || '').toLowerCase().includes(q) ||
      (e.statement_latex || '').toLowerCase().includes(q) ||
      (e.lean_symbol || '').toLowerCase().includes(q)
    );
  });

  document.getElementById('stats').textContent =
    `Showing ${filtered.length} of ${allEntries.length} entries`;

  const container = document.getElementById('cards');
  if (filtered.length === 0) {
    container.innerHTML = '<div class="no-results">No entries match your search.</div>';
    return;
  }

  container.innerHTML = filtered.map(([id, e]) => {
    const statusBadge = e.status === 'partial'
      ? `<span class="badge badge-partial">partial</span>` : '';
    const latexHtml = e.statement_latex
      ? latexToHtml(e.statement_latex)
      : '<span style="color:#94a3b8">—</span>';
    return `
    <div class="card" data-id="${esc(id)}">
      <div class="card-header">
        <span class="badge badge-id">${esc(id)}</span>
        <span class="badge ${kindBadge(e.kind)}">${esc(e.kind)}</span>
        ${statusBadge}
        <span class="card-title">${esc(e.name || '—')}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="card-body">
        <div class="section-label">Textbook Statement</div>
        <div class="latex-statement">${latexHtml}</div>

        <div class="section-label">Lean Statement</div>
        ${e.lean_statement
          ? `<pre class="lean-block">${esc(e.lean_statement)}</pre>`
          : `<span style="color:#94a3b8">—</span>`}

        <div class="symbol-line">${esc(e.lean_symbol || '')}</div>
      </div>
    </div>`;
  }).join('');

  container.querySelectorAll('.card-header').forEach(h => {
    h.addEventListener('click', () => {
      const card = h.parentElement;
      card.classList.toggle('open');
      // Typeset math in this card the first time it opens
      if (card.classList.contains('open') && !card.dataset.typeset) {
        card.dataset.typeset = '1';
        if (window.MathJax?.typesetPromise) {
          MathJax.typesetPromise([card]);
        }
      }
    });
  });
}

function buildFilters(entries) {
  const kinds = ['all', ...new Set(entries.map(([, e]) => e.kind).filter(Boolean))].sort();
  const container = document.getElementById('filters');
  container.innerHTML = kinds.map(k =>
    `<button class="filter-btn${k === 'all' ? ' active' : ''}" data-kind="${k}">
      ${k === 'all' ? 'All' : k}
    </button>`
  ).join('');

  container.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      container.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeKind = btn.dataset.kind;
      render();
    });
  });
}

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value;
  render();
});

fetch('theorem_mapping.json')
  .then(r => r.json())
  .then(data => {
    allEntries = Object.entries(data).sort(([a], [b]) => a.localeCompare(b));
    buildFilters(allEntries);
    render();
  })
  .catch(() => {
    document.getElementById('cards').innerHTML =
      '<div class="no-results">Could not load theorem_mapping.json.<br>' +
      'Serve this directory with: <code>python -m http.server 8080</code></div>';
  });
</script>
</body>
</html>
